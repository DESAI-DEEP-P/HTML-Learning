<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Be My Valentine 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
  background-size:400% 400%;
  animation:bgMove 12s infinite;
  font-family:Poppins,sans-serif;
  overflow:hidden;
}

@keyframes bgMove {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* ---------- CARD ---------- */
.card {
  width:420px;
  padding:40px;
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(15px);
  border-radius:28px;
  text-align:center;
  position:relative;
  z-index:2;
}

h2 {
  font-family:"Playfair Display",serif;
  margin-bottom:25px;
  color:#4a1c2f;
}

/* ---------- EMOJIS ---------- */
.emoji span {
  font-size:64px;
  display:inline-block;
  margin:0 6px;
}

.chick { animation: flap 1.5s infinite; }
.frog { animation: hop 1.8s infinite; }
.heartEmoji { animation: pulse 1.6s infinite; }

@keyframes flap {
  50% { transform:translateY(-6px) rotate(6deg); }
}

@keyframes hop {
  40% { transform:translateY(-14px); }
}

@keyframes pulse {
  50% { transform:scale(1.15); }
}

/* ---------- BUTTONS ---------- */
.buttons {
  position:relative;
  height:110px;
}

button {
  position:absolute;
  padding:14px 36px;
  border:none;
  border-radius:40px;
  cursor:pointer;
  font-size:16px;
}

#yes {
  left:10%;
  background:#ff4d6d;
  color:white;
}

#no {
  left:55%;
  background:#fff;
}

/* ---------- FIRST SCREEN ANIMALS ---------- */
.scene {
  position:absolute;
  inset:0;
  pointer-events:none;
}

.pond {
  position:absolute;
  left:5%;
  bottom:10%;
  font-size:50px;
}

.frog-run {
  position:absolute;
  left:5%;
  bottom:18%;
  font-size:40px;
  animation:frogRun 4s infinite alternate ease-in-out;
}

@keyframes frogRun {
  from { transform:translateX(0); }
  to { transform:translateX(120px); }
}

.chicken-run {
  position:absolute;
  right:5%;
  bottom:12%;
  font-size:40px;
  animation:chickenRun 3.5s infinite alternate;
}

@keyframes chickenRun {
  from { transform:translateX(0) translateY(0); }
  to { transform:translateX(-120px) translateY(-20px); }
}

/* ---------- YAY SCREEN ---------- */
#yayScreen {
  display:none;
}

.couple {
  position:absolute;
  left:6%;
  bottom:20%;
  font-size:44px;
}

.couple .heart {
  position:absolute;
  left:50%;
  animation:floatHeart 2s infinite;
}

@keyframes floatHeart {
  from { transform:translateY(0); opacity:1; }
  to { transform:translateY(-40px); opacity:0; }
}

.horse {
  position:absolute;
  right:6%;
  bottom:20%;
  font-size:44px;
  animation:horseHop 1.8s infinite;
}

@keyframes horseHop {
  50% { transform:translateY(-20px); }
}
</style>
</head>

<body>

<div class="scene" id="firstScene">
  <div class="pond">🌊</div>
  <div class="frog-run">🐸</div>
  <div class="chicken-run">🐥</div>
</div>

<div class="scene" id="yayScene" style="display:none">
  <div class="couple">
    🐸 🐥
    <div class="heart">❤️</div>
  </div>
  <div class="horse">🐎</div>
</div>

<div class="card" id="card">
  <div class="emoji">
    <span class="chick">🐥</span>
    <span class="heartEmoji">❤️</span>
    <span class="frog">🐸</span>
  </div>

  <h2>Sakina Kakkai,<br>will you be my Valentine?</h2>

  <div class="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No 🙈</button>
  </div>
</div>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseenter", () => {
  noBtn.style.left = Math.random()*200+"px";
  noBtn.style.top = Math.random()*60+"px";
});

yesBtn.addEventListener("click", () => {
  confetti({ particleCount:300, spread:160, origin:{x:0.5,y:0.5} });

  document.getElementById("firstScene").style.display="none";
  document.getElementById("yayScene").style.display="block";
});
</script>

</body>
</html>
