<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
  font-family:Poppins,sans-serif;
  overflow:hidden;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.card{
  width:min(92%,420px);
  padding:40px 30px 45px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(18px);
  border-radius:28px;
  text-align:center;
  position:relative;
}

.emoji{
  font-size:64px;
  margin-bottom:12px;
  animation:heartbeat 1.8s infinite;
}

@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.1)}
}

h2{
  font-family:"Playfair Display",serif;
  font-size:28px;
  color:#4a1c2f;
  margin-bottom:30px;
}

.buttons{
  position:relative;
  height:120px; /* FIX 1 */
}

button{
  position:absolute;
  padding:14px 36px;
  border-radius:40px;
  border:none;
  font-size:16px;
  cursor:pointer;
}

#yes{
  left:12%;
  background:linear-gradient(135deg,#ff4d6d,#ff758f);
  color:#fff;
}

#no{
  left:55%;
  background:#fff;
  color:#777;
}

.hint{
  margin-top:28px;
  font-size:13px;
  color:#6b6b6b;
  font-style:italic;
}

/* ❤️ floating hearts */
.heart{
  position:absolute;
  bottom:-20px;
  animation:floatUp linear forwards;
  pointer-events:none;
}

@keyframes floatUp{
  to{transform:translateY(-120vh);opacity:0}
}

/* 🐸 frog */
.frog{
  position:absolute;
  font-size:28px;
  animation:frogJump 4s infinite linear;
  opacity:.35;
}

@keyframes frogJump{
  0%{left:-10%;top:80%}
  50%{left:50%;top:60%}
  100%{left:110%;top:85%}
}

/* 💖 final screen */
#final{
  display:none;
  text-align:center;
}

#final h1{
  font-size:34px;
}

#final img{
  width:220px;
  border-radius:18px;
  margin:16px 0;
}
</style>
</head>

<body>

<div class="card" id="mainCard">
  <div class="emoji">🐔❤️🐸</div>
  <h2>Sakina Kakkai,<br>will you be my Valentine?</h2>

  <div class="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No 🙈</button>
  </div>

  <div class="hint">Some love stories don’t allow “no” ✨</div>
</div>

<!-- 💖 FINAL SCREEN -->
<div class="card" id="final">
  <h1>💖 YAY!!! 💖</h1>
  <p>Best decision ever 🥰</p>
  <img src="/mnt/data/774a8b5a-6d98-4575-b31c-2918c982eb0e.png">
  <p>I love you ❤️</p>
</div>

<audio id="hoverSound" src="https://assets.mixkit.co/sfx/preview/mixkit-cartoon-voice-laugh-343.mp3"></audio>
<audio id="yesSound" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>

<script>
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const buttonsBox=document.querySelector(".buttons");
const hoverSound=document.getElementById("hoverSound");
const yesSound=document.getElementById("yesSound");

/* 🔊 unlock audio */
document.body.addEventListener("click",()=>{
  hoverSound.play().catch(()=>{});
  hoverSound.pause();
},{once:true});

/* ❌ No button move (desktop + mobile) */
function moveNo(){
  hoverSound.currentTime=0;
  hoverSound.play();

  const c=buttonsBox.getBoundingClientRect();
  const b=noBtn.getBoundingClientRect();

  noBtn.style.left=Math.random()*(c.width-b.width)+"px";
  noBtn.style.top=Math.random()*(c.height-b.height)+"px";
}
noBtn.addEventListener("mouseenter",moveNo);
noBtn.addEventListener("touchstart",moveNo);

/* 💖 YES CLICK */
yesBtn.addEventListener("click",()=>{
  yesSound.play();

  document.getElementById("mainCard").style.display="none";
  document.getElementById("final").style.display="block";

  confetti({
    particleCount:420,
    spread:160,
    origin:{x:.5,y:.6},
    shapes:["circle"],
    emojis:["🌹","🌸","🥀"]
  });
});

/* ❤️ hearts */
function createHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML=Math.random()>.5?"❤️":"💗";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=Math.random()*3+4+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),8000);
}
setInterval(createHeart,420);

/* 🐸 frog */
const frog=document.createElement("div");
frog.className="frog";
frog.textContent="🐸";
document.body.appendChild(frog);
</script>

</body>
</html>
