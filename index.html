<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Be My Valentine 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Poppins,sans-serif;
  min-height:100vh;
  background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
  background-size:400% 400%;
  animation:bg 12s infinite;
  overflow:hidden;
}
@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* SCENES */
.scene{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
#yayScene{display:none;z-index:10}

/* CARD */
.card{
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(16px);
  padding:40px 30px;
  border-radius:26px;
  text-align:center;
  width:min(92%,420px);
}
.emoji span{font-size:60px;margin:0 6px}
h2{margin:20px 0;color:#4a1c2f}
.buttons{position:relative;height:120px}
button{
  position:absolute;
  padding:14px 36px;
  border-radius:40px;
  border:none;
  cursor:pointer;
}
#yes{left:10%;background:#ff4d6d;color:#fff}
#no{left:55%}

/* FIRST SCREEN ANIMALS */
.left-pond,.right-farm{
  position:absolute;
  bottom:30px;
  font-size:60px;
}
.left-pond{left:20px}
.right-farm{right:20px}
.frog{animation:hop 1.5s infinite}
.chicken{animation:run 2s infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
@keyframes run{0%,100%{transform:translateX(0)}50%{transform:translateX(-40px)}}

/* YAY SCREEN */
.yay-container{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}
.yay-card{
  background:white;
  padding:30px;
  border-radius:24px;
  text-align:center;
  width:min(92%,420px);
  animation:pop .6s ease;
}
@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}
.yay-animals{
  display:flex;
  justify-content:space-between;
  width:100%;
  font-size:60px;
}
.heart-float{
  position:absolute;
  animation:floatUp 3s infinite;
}
@keyframes floatUp{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-120px);opacity:0}
}
.horse{animation:hop 1.3s infinite}
</style>
</head>

<body>

<!-- FIRST SCENE -->
<div class="scene" id="firstScene">
  <div class="left-pond">
    🌊 <div class="frog">🐸</div>
  </div>
  <div class="right-farm">
    🌾 <div class="chicken">🐥</div>
  </div>

  <div class="card">
    <div class="emoji">
      <span>🐥</span><span>❤️</span><span>🐸</span>
    </div>
    <h2>Siddharth Mistry,<br>will you let be me your Valentine?</h2>

    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 🙈</button>
    </div>
  </div>
</div>

<!-- YAY SCENE -->
<div class="scene" id="yayScene">
  <div class="yay-card">
    <div style="font-size:26px;margin-bottom:12px;">
      🥰 I knew I made a good choice
    </div>

    <img 
      src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
      alt="cat kiss"
      style="width:100%;border-radius:18px;margin:10px 0;"
    >

    <div style="font-size:20px;color:#ff4d6d;">
      I love you ❤️
    </div>
  </div>
</div>


<script>
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const box=document.querySelector(".buttons");

function moveNo(){
  const r=box.getBoundingClientRect();
  no.style.left=Math.random()*(r.width-80)+"px";
  no.style.top=Math.random()*(r.height-40)+"px";
}
no.addEventListener("mouseenter",moveNo);
no.addEventListener("touchstart",moveNo);

yes.addEventListener("click",()=>{
  confetti({particleCount:400,spread:180,origin:{x:.5,y:.5}});
  document.getElementById("firstScene").style.display="none";
  document.getElementById("yayScene").style.display="flex";
});

function hearts(){
  const h=document.createElement("div");
  h.className="heart-float";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=Math.random()*18+12+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),3000);
}
setInterval(hearts,800);
</script>

</body>
</html>
