<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine 💖</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
  }

  body{
    height:100vh;
    background:linear-gradient(135deg,#ffd6e8,#ffeef6);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
  }

  .scene{
    display:none;
    width:100%;
    height:100%;
    justify-content:center;
    align-items:center;
  }

  .scene.active{
    display:flex;
  }

  /* ---------- FIRST SCREEN ---------- */
  .card{
    background:rgba(255,255,255,.9);
    padding:35px;
    border-radius:28px;
    text-align:center;
    width:360px;
    animation:pop .6s ease;
  }

  .emoji{
    font-size:48px;
    margin-bottom:12px;
  }

  h1{
    font-size:24px;
    margin-bottom:22px;
  }

  .buttons{
    display:flex;
    justify-content:space-between;
    gap:14px;
  }

  button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:18px;
    font-size:16px;
    cursor:pointer;
  }

  .yes{
    background:#ff4d6d;
    color:white;
  }

  .no{
    background:#eaeaea;
  }

  /* ---------- YAY SCREEN ---------- */
  .yay-card{
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(14px);
    padding:30px;
    border-radius:26px;
    text-align:center;
    width:min(92%,420px);
    animation:pop .6s ease;
  }

  .yay-card img{
    width:100%;
    border-radius:20px;
    margin:12px 0;
  }

  /* ---------- ANIMATIONS ---------- */
  @keyframes pop{
    from{
      transform:scale(.7);
      opacity:0;
    }
    to{
      transform:scale(1);
      opacity:1;
    }
  }
</style>
</head>

<body>

<!-- ---------- FIRST SCREEN ---------- -->
<div class="scene active" id="firstScene">
  <div class="card">
    <div class="emoji">🐥❤️🐸</div>
    <h1>Will you be my Valentine?</h1>

    <div class="buttons">
      <button class="yes" onclick="goToYay()">Yes 💖</button>
      <button class="no">No 🙃</button>
    </div>
  </div>
</div>

<!-- ---------- YAY SCREEN ---------- -->
<div class="scene" id="yayScene">
  <div class="yay-card">
    <div style="font-size:26px;margin-bottom:10px;">
      🥰 I knew I made a good choice
    </div>

    <img 
      src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
      alt="cat kissing gif"
    >

    <div style="font-size:20px;color:#ff4d6d;">
      I love you ❤️
    </div>
  </div>
</div>

<script>
  function goToYay(){
    document.getElementById("firstScene").classList.remove("active");
    document.getElementById("yayScene").classList.add("active");
  }
</script>

</body>
</html>
